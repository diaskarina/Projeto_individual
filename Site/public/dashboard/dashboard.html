    function obterDadosGrafico(idUsuario) {
        fetch(`/quiz/usuario/${idUsuario}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        plotarGraficoBarra(resposta[resposta.length - 1])
                        plotarGraficoDoughnut(resposta[resposta.length - 1])
                        document.getElementById("kpiTentativas").innerHTML = resposta.length
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function (error) {
                console.error(`Erro: ${error.message}`);
            });
    }

    // Função para plotar o gráfico de barra
    function plotarGraficoBarra(dados) {
        console.log('iniciando plotagem do gráfico...');

        //Criando estrutura de dados 
        const labels = ['Artistas', 'Curiosidades', 'História', 'Letras'];

        const data = {
            labels: labels,
            datasets: [{
                data: [
                    dados.acertos_artistas,
                    dados.acertos_curiosidades,
                    dados.acertos_historia,
                    dados.acertos_letras
                ],
                backgroundColor: [
                    'rgba(245, 197, 24, 0.6)',   // Amarelo - Artistas
                    'rgba(230, 0, 90, 0.6)',     // Rosa - Curiosidades
                    'rgba(227, 176, 98, 0.6)',   // Dourado - História
                    'rgba(242, 217, 176, 0.6)'  // Bege - Letras
                ],
                borderColor: [
                    'rgb(245, 197, 24)',
                    'rgb(230, 0, 90)',
                    'rgb(227, 176, 98)',
                    'rgb(242, 217, 176)'
                ],
                borderWidth: 1
            }]
        };

        const config = {
            type: 'bar',
            data: data,
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Acertos por Tema',
                        color: '#ffffff',
                        font: {
                            size: 20  // ✅ título
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                indexAxis: 'y',
                scales: {
                    x: {
                        ticks: {
                            color: '#ffffff',
                            font: {
                                size: 14  // ✅ números do eixo X
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 4,
                        ticks: {
                            color: '#ffffff',
                            font: {
                                size: 16  // ✅ labels do eixo Y (Artistas, Curiosidades...)
                            },
                        }
                    }
                }
            }
        };
        // ✅ adiciona isso antes de fechar a função
        new Chart(document.getElementById('myChartBar'), config)
    }
    function plotarGraficoDoughnut(dados) {
        var porcentagem = dados.porcentagem
        var restante = 100 - porcentagem

        var ctx = document.getElementById('myChartDoughnut').getContext('2d');

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Aproveitamento', 'Restante'],
                datasets: [{
                    data: [porcentagem, restante],
                    backgroundColor: [
                        'rgba(245, 197, 24, 0.8)',   // Amarelo - Aproveitamento
                        'rgba(230, 0, 90, 0.3)'     // Rosa - Restante
                    ],
                    borderColor: [
                        'rgb(245, 197, 24)',
                        'rgb(230, 0, 90)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                cutout: '50%',
                plugins: {
                    title: {
                        display: true,
                        text: 'Aproveitamento Geral',
                        color: '#ffffff',
                        font: {
                            size: 20
                        }
                    },
                    legend: {
                        display: true,
                        labels: {
                            color: '#ffffff',  // ✅ cor da legenda
                            font: {
                                size: 14
                            }
                        }
                    }
                },
            },
                plugins: [{
                    id: 'textoCentral',
                    beforeDraw(chart) {
                        const { ctx, chartArea: { top, right, bottom, left, width, height } } = chart;
                        ctx.save();
                        ctx.font = 'bold 30px Poppins';
                        ctx.fillStyle = 'white';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${porcentagem}%`, left + width / 2, top + height / 2);
                        ctx.restore();
                    }
                }]
            });
    }
